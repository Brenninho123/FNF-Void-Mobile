name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [FNF-Void-Mod]
  pull_request:
    branches: [FNF-Void-Mod]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android NDK r21e
        run: |
          sdkmanager --install "ndk;21.4.7075529"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> $GITHUB_ENV

      - name: Setup Haxe 4.3.7
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7

      - name: Install haxelibs
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl 9.2.0 --quiet
          haxelib install flixel 5.1.0 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install actuate --quiet
          haxelib git polymod https://github.com/larsiusprime/polymod.git b19c3d5 --quiet
          haxelib install extension-androidtools --quiet
          haxelib run lime setup -alias -y
          printf '\n' | haxelib run lime setup android

      - name: Patch source files
        run: |
          # Fix Main.hx FlxGame constructor zoom type (Float -> Int)
          sed -i 's/new FlxGame(gameWidth, gameHeight, initialState, zoom,/new FlxGame(gameWidth, gameHeight, initialState, Std.int(zoom),/' source/Main.hx

          # Remove NGio references
          sed -i '/import io\.newgrounds\.NG;/d' source/Highscore.hx source/KeyBindMenu.hx source/ResultsScreen.hx source/DiffOverview.hx 2>/dev/null || true
          sed -i '/NGio\./d' source/Highscore.hx source/PlayState.hx 2>/dev/null || true

          # Fix PlayState webm import (ensure it has cpp guard)
          sed -i '/import webm\.WebmPlayer;/d' source/PlayState.hx 2>/dev/null || true
          sed -i '/#if cpp/a import webm.WebmPlayer;' source/PlayState.hx 2>/dev/null || true

      - name: Setup Lime Android config
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build APK
        run: haxelib run lime build android -final

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VsVoid-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
