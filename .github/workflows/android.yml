name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [FNF-Void-Mod]
  pull_request:
    branches: [FNF-Void-Mod]

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7
  NDK_VERSION: 21.4.7075529
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4 -Dorg.gradle.caching=true -Dorg.gradle.jvmargs="-Xmx4g"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK components
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/licenses
          key: android-sdk-ndk-${{ env.NDK_VERSION }}

      - name: Accept Android SDK licenses
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: yes | sdkmanager --licenses

      - name: Install Android NDK
        run: |
          if [ ! -d "$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" ]; then
            sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib repository
        id: haxelib-cache
        uses: actions/cache@v4
        with:
          path: ~/haxelib
          key: haxelib-${{ runner.os }}-${{ env.HAXE_VERSION }}-v1

      - name: Configure haxelib path
        run: |
          mkdir -p ~/haxelib
          haxelib setup ~/haxelib

      - name: Install haxelibs
        if: steps.haxelib-cache.outputs.cache-hit != 'true'
        run: |
          haxelib install lime 8.3.2 --quiet
          haxelib install openfl 9.2.0 --quiet
          haxelib install flixel 5.1.0 --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install flixel-ui 2.6.1 --quiet
          haxelib install hscript 2.5.0 --quiet
          haxelib install actuate --quiet
          haxelib install polymod 1.4.3 --quiet
          haxelib install extension-androidtools --quiet
          haxelib run lime setup -alias -y
          printf '\n' | haxelib run lime setup android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Patch source files
        run: |
          for f in source/Highscore.hx source/KeyBindMenu.hx source/ResultsScreen.hx source/DiffOverview.hx source/PlayState.hx; do
            [ -f "$f" ] && sed -i '/import io\.newgrounds\.NG;/d; /NGio\./d' "$f" || true
          done
          grep -n "webm\.WebmPlayer" source/PlayState.hx | awk -F: '{print $1}' | sort -rn | while read ln; do
            ctx_start=$((ln - 1))
            ctx_end=$((ln + 1))
            sed -n "${ctx_start}p" source/PlayState.hx | grep -q "#if cpp" && sed -i "${ctx_start},${ctx_end}d" source/PlayState.hx || sed -i "${ln}d" source/PlayState.hx
          done || true
          sed -i '/WebmPlayer\./d; /webmHandler\./d; /var ourSource/d; /WEBM SHIT/d; /GlobalVideo\.setWebm/d; /var data =.*bitmapData/d; /loadGraphic(data)/d' source/PlayState.hx || true

      - name: Patch AndroidManifest for game category
        run: |
          MANIFEST="export/release/android/bin/app/src/main/AndroidManifest.xml"
          mkdir -p export/release/android/bin/app/src/main
          if [ ! -f "$MANIFEST" ]; then
            cat > "$MANIFEST" << 'MANIFEST_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:glEsVersion="0x00020000" android:required="true" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="true" />
              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:isGame="true"
                  android:appCategory="game"
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name="MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="landscape">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />
          </manifest>
          MANIFEST_EOF
          fi

      - name: Setup Lime Android config
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_SDK_ROOT
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Prepare project file
        run: |
          if [ -f "project.xml" ]; then
            echo "project.xml already present"
          elif [ -f "Project.xml" ]; then
            cp "Project.xml" "project.xml"
            echo "Copied Project.xml to project.xml"
          else
            echo "ERROR: No project file found!"
            ls -la
            exit 1
          fi

      - name: Build APK
        run: haxelib run lime build project.xml android -final

      - name: Patch AndroidManifest post-build
        run: |
          MANIFEST="export/release/android/bin/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/<application/<application android:isGame="true" android:appCategory="game"/' "$MANIFEST" 2>/dev/null || true
            grep -q 'isGame' "$MANIFEST" && echo "isGame flag confirmed" || echo "warn: isGame not found"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VsVoid-Android
          path: |
            export/release/android/bin/app/build/outputs/apk/**/*.apk
            export/release/android/bin/*.apk
          if-no-files-found: error
          compression-level: 6
